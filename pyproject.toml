[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri"
version = "1.0.0"
description = "Smart Crop AI - agricultural decision-support platform (10 modules, FAO-56 irrigation, FastAPI serving)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Kudum Veerabhadraiah" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tenacity>=8.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "joblib>=1.4",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# transformers is required by the disease module (it loads third-party
  # PlantVillage-style weights); torchvision is required by soil_image.
  vision = ["torch>=2.3", "torchvision>=0.18", "transformers>=4.40"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
agri = "agri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agri = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "unit: fast, no network, no model artefacts",
  "integration: crosses module boundaries, may need artefacts",
  "regression: enforces metric floors and frozen API contracts",
  "slow: excluded from the default CI job",
  "network: requires outbound HTTP",
]
filterwarnings = ["error::DeprecationWarning:agri.*"]
# pytest-asyncio warns when this is unset, and warns go to stderr. Declaring it keeps
# the suite free of pytest's own deprecation noise so a stderr warning cannot be
# mistaken for a test failure in a shell that treats stderr as an error signal.
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["agri"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["agri"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true