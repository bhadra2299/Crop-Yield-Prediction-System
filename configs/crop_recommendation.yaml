name: crop_recommendation
version: "1.0.0"
task: classification
description: Recommend a suitable crop from soil chemistry (N, P, K, pH) and climate.
owner: data-science
seed: 42

data:
  raw: data/raw/crop_recommendation/crop_recommendation.csv
  target: label
  features: [N, P, K, temperature, humidity, ph, rainfall]
  drop: []
  id_columns: []
  required_columns: [N, P, K, temperature, humidity, ph, rainfall, label]
  allow_missing: []
  max_missing_fraction: 0.0
  min_rows: 500
  classes: [apple, banana, blackgram, chickpea, coconut, coffee, cotton, grapes, jute,
            kidneybeans, lentil, maize, mango, mothbeans, mungbean, muskmelon, orange,
            papaya, pigeonpeas, pomegranate, rice, watermelon]

split:
  strategy: stratified
  test_size: 0.2
  val_size: 0.0
  n_splits: 5
  shuffle: true

model:
  family: sklearn
  algorithm: RandomForest
  params:
    n_estimators: 400
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    n_jobs: -1
  calibrate: true
  calibration_method: sigmoid
  feature_importance: true
  uncertainty: none
  target_transform: none
  class_weight: null

gates:
  primary_metric: macro_f1
  minimum: 0.95
  secondary_metrics: [accuracy, weighted_f1, roc_auc_ovr]
  must_beat_baseline: true
  baseline: majority_class

serving:
  latency_budget_ms: 300
  confidence_high: 0.80
  confidence_medium: 0.60
  cacheable: true
  warmup: true
  allow_fallback: false
