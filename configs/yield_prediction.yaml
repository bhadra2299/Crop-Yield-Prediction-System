name: yield_prediction
version: "1.0.0"
task: regression
description: Predict crop yield (tonnes per hectare) from area, inputs, rainfall and crop history.
owner: data-science
seed: 42

data:
  raw: data/raw/yield/crop_yield.csv
  target: Yield
  features: [Crop, Crop_Year, Season, State, Area, Annual_Rainfall, Fertilizer, Pesticide]
  drop: [Production]
  id_columns: []
  required_columns: [Crop, Crop_Year, Season, State, Area, Production, Annual_Rainfall, Fertilizer, Pesticide, Yield]
  allow_missing: []
  max_missing_fraction: 0.0
  min_rows: 5000
  time_column: Crop_Year
  group_column: Crop

# Production is deliberately excluded: it is recorded after harvest, so it is a
# leak of the target. Validation additionally rejects it if it ever reappears.
split:
  strategy: time
  test_size: 0.2
  time_column: Crop_Year
  train_end: 2014
  test_start: 2015
  shuffle: false

model:
  family: xgboost
  algorithm: XGBoost
  params:
    n_estimators: 400
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    n_jobs: -1
  calibrate: false
  feature_importance: true
  uncertainty: conformal
  target_transform: log1p
  class_weight: null

gates:
  primary_metric: r2
  minimum: 0.60
  secondary_metrics: [rmse, mae, median_ape]
  must_beat_baseline: true
  baseline: median

serving:
  latency_budget_ms: 400
  confidence_high: 0.80
  confidence_medium: 0.60
  cacheable: true
  warmup: true
  allow_fallback: false
