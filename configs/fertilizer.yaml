name: fertilizer
version: "1.0.0"
task: classification
description: Recommend a fertilizer blend from soil type, crop type, moisture and N-P-K levels.
owner: data-science
seed: 42

data:
  raw: data/raw/fertilizer/fertilizer_prediction.csv
  target: Fertilizer Name
  features: [Temparature, Humidity, Moisture, "Soil Type", "Crop Type", Nitrogen, Potassium, Phosphorous]
  drop: []
  required_columns: [Temparature, Humidity, Moisture, "Soil Type", "Crop Type", Nitrogen, Potassium, Phosphorous, "Fertilizer Name"]
  allow_missing: []
  max_missing_fraction: 0.0
  min_rows: 80
  classes: ["Urea", "DAP", "14-35-14", "28-28", "17-17-17", "20-20", "10-26-26"]

# Only 99 rows exist, so repeated stratified k-fold gives both a mean and a
# spread. A single 80/20 split on 99 rows is a coin toss, and the service layer
# labels this module low-confidence for exactly that reason.
split:
  strategy: repeated_kfold
  test_size: 0.2
  n_splits: 5
  n_repeats: 3

model:
  family: sklearn
  algorithm: RandomForest
  params:
    n_estimators: 400
    max_depth: 8
    min_samples_leaf: 1
    n_jobs: -1
  calibrate: true
  calibration_method: sigmoid
  feature_importance: true
  uncertainty: none
  target_transform: none
  class_weight: balanced

gates:
  primary_metric: macro_f1
  minimum: 0.60
  secondary_metrics: [accuracy, weighted_f1]
  must_beat_baseline: true
  baseline: majority_class

serving:
  latency_budget_ms: 300
  # Deliberately high thresholds: with 99 training rows a confident answer is
  # not a well-founded one, so most responses surface as medium or low.
  confidence_high: 0.90
  confidence_medium: 0.70
  cacheable: true
  warmup: true
  allow_fallback: false